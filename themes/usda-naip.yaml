# OGM supported_schemas includes Aardvark; verified 2026-11-11.
id: usda-naip
label: USDA · NAIP imagery
site:
  title:
    en: USDA · NAIP imagery | OpenGeoMetadata
  short_name: USDA · NAIP imagery
  description:
    en: >-
      Explore National Agriculture Imagery Program records: aerial imagery, acquisition dates,
      and state-by-year tile indexes. Follow each record to imagery services or the original
      data.
  locale: en
  supported_locales:
    - en
  show_theme_selector: true
  routing:
    mode: hash
  icons:
    manifest: /theme-icons/usda-naip/manifest.webmanifest
  manifest:
    background_color: '#F0F5EA'
    theme_color: '#285943'
  banner:
    enabled: true
    tone: notice
    text:
      en: >-
        OpenGeoMetadata community prototype. Consult the source institution or publisher for
        official services.
institution:
  name: USDA · NAIP imagery
  logo_url: /opengeometadata-bauhaus-logo.svg
  logo_alt:
    en: OpenGeoMetadata geometric logo
  logo_lockup:
    separator: none
    right_text:
      en: USDA · NAIP imagery
    subtext:
      en: OpenGeoMetadata / Collection explorer
  header:
    logo_height_rem: 3.5
    lockup_text_size_rem: 1.2
  hero_text:
    en: See the landscape from above.
  hero_description:
    en: >-
      Explore National Agriculture Imagery Program records: aerial imagery, acquisition dates,
      and state-by-year tile indexes. Follow each record to imagery services or the original
      data.
branding:
  colors:
    primary: '#285943'
    active: '#285943'
    surface: '#FFFFFF'
    surface_alt: '#F0F5EA'
    text: '#202A30'
    muted: '#505D64'
    border: '#D3DCE0'
    page_background: '#F0F5EA'
    header_background: '#285943'
    header_text: '#FFFFFF'
    hero_panel_accent: '#285943'
    button_primary_hover: '#285943'
    button_secondary_text: '#285943'
    button_secondary_border: '#D3DCE0'
    button_secondary_background: '#FFFFFF'
    button_secondary_hover: '#F0F5EA'
    lockup_background: '#285943'
    lockup_foreground: '#FFFFFF'
api:
  base_url: https://ogm.geo4lib.app/api/v1/
  client_name: ogm-usda-naip
  default_query_params:
    - include_filters[ogm_repo][]=gov.usda.naip
navigation:
  cta:
    label:
      en: Source metadata
    href: https://github.com/OpenGeoMetadata/gov.usda.naip
    external: true
  cta_style: utility
  links:
    - label:
        en: Search
      href: /search?q=
      external: false
    - label:
        en: Bookmarks
      href: /bookmarks
      external: false
homepage:
  collection_intro:
    eyebrow:
      en: USDA · NAIP imagery / Collection explorer
    facts:
      - value:
          en: Aerial imagery
        label:
          en: Discover
      - value:
          en: Acquisition dates
        label:
          en: Explore
      - value:
          en: Tile indexes
        label:
          en: Collection context
    pathways:
      - label:
          en: 01 / Imagery
        title:
          en: Explore aerial imagery
        description:
          en: Browse imagery records and open their available services.
        href: /search?q=&include_filters[gbl_resourceClass_sm][]=Imagery&view=gallery
      - label:
          en: 02 / Tiles
        title:
          en: Find an imagery tile index
        description:
          en: Locate state-by-year indexes and follow tile links to the original imagery.
        href: /search?q=&include_filters[gbl_resourceType_sm][]=Index%20maps&view=gallery
      - label:
          en: 03 / Dates
        title:
          en: Check when imagery was flown
        description:
          en: Search image-date records before interpreting or comparing imagery.
        href: /search?q=image%20dates
    map_heading:
      en: Explore geographic coverage
    map_description:
      en: Search a place or select an area on the map to discover records in this collection.
  hero_actions:
    - label:
        en: Search this collection
      href: /search?q=&view=gallery
      external: false
  hero_map:
    center:
      - 39
      - -98
    zoom: 5
    initial_pan_px:
      - 0
      - 0
  featured_items:
    - id: usda-naip
      camera:
        mode: fitBounds
        maxZoom: 8
        padding:
          - 48
          - 48
        duration: 1
    - id: usda-naip-dates-2012
      camera:
        mode: fitBounds
        maxZoom: 8
        padding:
          - 48
          - 48
        duration: 1
  collection_spotlights: []
  partner_institutions: []
  blog:
    enabled: false
footer:
  style: network
  title:
    en: USDA · NAIP imagery
  copyright:
    en: >-
      Metadata is shared through OpenGeoMetadata. Access and reuse conditions vary by resource;
      consult the original record.
  link_groups:
    - title:
        en: Explore the source
      links:
        - label:
            en: Collection repository
          href: https://github.com/OpenGeoMetadata/gov.usda.naip
          external: true
        - label:
            en: About OpenGeoMetadata
          href: https://opengeometadata.org/
          external: true
  show_api_debug: false
