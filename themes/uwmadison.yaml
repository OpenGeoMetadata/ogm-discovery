id: uwmadison
label: University of Wisconsin-Madison
site:
  title: UW-Madison Geoportal
  short_name: UW-Madison Geoportal
  description: Search geospatial resources from the University of Wisconsin-Madison.
  locale: en
  supported_locales:
    - en
  show_theme_selector: true
  routing:
    mode: hash
  icons:
    manifest: /theme-icons/uwmadison/manifest.webmanifest
    favicon: /theme-icons/uwmadison/favicon.ico
    favicon_svg: /theme-icons/uwmadison/favicon.svg
    apple_touch_icon: /theme-icons/uwmadison/apple-touch-icon-180x180.png
    pwa:
      - src: /theme-icons/uwmadison/pwa-64x64.png
        sizes: 64x64
        type: image/png
      - src: /theme-icons/uwmadison/pwa-192x192.png
        sizes: 192x192
        type: image/png
      - src: /theme-icons/uwmadison/pwa-512x512.png
        sizes: 512x512
        type: image/png
  manifest:
    background_color: '#C5050C'
    theme_color: '#C5050C'
institution:
  name: UW-Madison Geoportal
  logo_url: /uw-madison-logo.svg
  logo_alt: UW-Madison Geoportal logo
  hero_text:
    en: Search geospatial resources from the University of Wisconsin-Madison.
  hero_description: Browse and download GIS data, maps, and other geospatial resources.
branding:
  colors:
    primary: '#C5050C'
    active: '#9B0000'
  fonts:
    sans: '"Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
api:
  base_url: https://geo.btaa.org/api/v1/
  search_path: /search
  suggest_path: /suggest
  gazetteer_search_path: /gazetteers/nominatim/search
  facets_path_template: /search/facets/{facetName}
  map_h3_path: /map/h3
  home_blog_posts_path: /home/blog-posts
  turnstile_status_path: /turnstile/status
  turnstile_verify_path: /turnstile/verify
  client_name: ogm-viewer
  default_query_params:
    - include_filters[schema_provider_s][]=University of Wisconsin-Madison
homepage:
  featured_items:
    - id: 374030b8-8a7a-4dd5-873a-4a9c1196e8f5 # Official State Highway Map, Wisconsin 1916
navigation:
  links:
    - href: /bookmarks
      label: Bookmarks
      external: false
footer:
  style: simple
  show_api_debug: true
