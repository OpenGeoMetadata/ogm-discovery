# OGM supported_schemas includes Aardvark; verified 2026-11-11.
id: stanford
label: Stanford EarthWorks
site:
  title:
    en: Stanford EarthWorks | OpenGeoMetadata
  short_name: Stanford EarthWorks
  description:
    en: >-
      Discover maps and geospatial data from Stanford University Libraries’ EarthWorks
      repository. Explore coverage, inspect metadata, and follow persistent links to the
      original resources.
  locale: en
  supported_locales:
    - en
  show_theme_selector: true
  routing:
    mode: hash
  icons:
    manifest: /theme-icons/stanford/manifest.webmanifest
  manifest:
    background_color: '#F8F3F0'
    theme_color: '#8C1515'
  banner:
    enabled: true
    tone: notice
    text:
      en: >-
        OpenGeoMetadata community prototype. Consult the source institution or publisher for
        official services.
institution:
  name: Stanford EarthWorks
  logo_url: /opengeometadata-bauhaus-logo.svg
  logo_alt:
    en: OpenGeoMetadata geometric logo
  logo_lockup:
    separator: none
    right_text:
      en: Stanford EarthWorks
    subtext:
      en: OpenGeoMetadata / Collection explorer
  header:
    logo_height_rem: 3.5
    lockup_text_size_rem: 1.2
  hero_text:
    en: A world of geographic research.
  hero_description:
    en: >-
      Discover maps and geospatial data from Stanford University Libraries’ EarthWorks
      repository. Explore coverage, inspect metadata, and follow persistent links to the
      original resources.
branding:
  colors:
    primary: '#8C1515'
    active: '#8C1515'
    surface: '#FFFFFF'
    surface_alt: '#F8F3F0'
    text: '#202A30'
    muted: '#505D64'
    border: '#D3DCE0'
    page_background: '#F8F3F0'
    header_background: '#8C1515'
    header_text: '#FFFFFF'
    hero_panel_accent: '#8C1515'
    button_primary_hover: '#8C1515'
    button_secondary_text: '#8C1515'
    button_secondary_border: '#D3DCE0'
    button_secondary_background: '#FFFFFF'
    button_secondary_hover: '#F8F3F0'
    lockup_background: '#8C1515'
    lockup_foreground: '#FFFFFF'
api:
  base_url: https://ogm.geo4lib.app/api/v1/
  client_name: ogm-stanford
  default_query_params:
    - include_filters[ogm_repo][]=edu.stanford.purl
navigation:
  cta:
    label:
      en: Source metadata
    href: https://github.com/OpenGeoMetadata/edu.stanford.purl
    external: true
  cta_style: utility
  links:
    - label:
        en: Search
      href: /search?q=
      external: false
    - label:
        en: Bookmarks
      href: /bookmarks
      external: false
homepage:
  collection_intro:
    eyebrow:
      en: Stanford EarthWorks / Collection explorer
    facts:
      - value:
          en: Maps + GIS
        label:
          en: Discover
      - value:
          en: Persistent links
        label:
          en: Explore
      - value:
          en: Stanford
        label:
          en: Collection context
    pathways:
      - label:
          en: 01 / Places
        title:
          en: Explore geographic coverage
        description:
          en: Use the interactive map and place filters to locate resources.
        href: /search?q=&view=gallery
      - label:
          en: 02 / Maps
        title:
          en: Browse the map collection
        description:
          en: Explore map records, then inspect their descriptions and available previews.
        href: /search?q=&include_filters[gbl_resourceClass_sm][]=Maps&view=gallery
      - label:
          en: 03 / Data
        title:
          en: Find geospatial datasets
        description:
          en: Browse datasets and follow their source links for access and use information.
        href: /search?q=&include_filters[gbl_resourceClass_sm][]=Datasets&view=gallery
    map_heading:
      en: Explore geographic coverage
    map_description:
      en: Search a place or select an area on the map to discover records in this collection.
  hero_actions:
    - label:
        en: Search this collection
      href: /search?q=&view=gallery
      external: false
  hero_map:
    center:
      - 37.43
      - -122.17
    zoom: 5
    initial_pan_px:
      - 0
      - 0
  featured_items:
    - id: stanford-bb014tx0752
      camera:
        mode: fitBounds
        maxZoom: 8
        padding:
          - 48
          - 48
        duration: 1
  collection_spotlights: []
  partner_institutions: []
  blog:
    enabled: false
footer:
  style: network
  title:
    en: Stanford EarthWorks
  copyright:
    en: >-
      Metadata is shared through OpenGeoMetadata. Access and reuse conditions vary by resource;
      consult the original record.
  link_groups:
    - title:
        en: Explore the source
      links:
        - label:
            en: Collection repository
          href: https://github.com/OpenGeoMetadata/edu.stanford.purl
          external: true
        - label:
            en: About OpenGeoMetadata
          href: https://opengeometadata.org/
          external: true
  show_api_debug: false
