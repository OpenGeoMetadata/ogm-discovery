      - -87.88
    zoom: 6
    initial_pan_px:
      - 0
      - 0
  featured_items:
    - id: ark:-77981-gmgs0000013
      camera:
        mode: fitBounds
        maxZoom: 8
        padding:
          - 48
          - 48
        duration: 1
    - id: ark:-77981-gmgs000002n
      camera:
        mode: fitBounds
        maxZoom: 8
        padding:
          - 48
          - 48
        duration: 1
  collection_spotlights: []
  partner_institutions: []
  blog:
    enabled: false
footer:
  style: network
  title:
    en: UWM · AGSL GeoDiscovery
  copyright:
