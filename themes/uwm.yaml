    en: UWM · AGSL GeoDiscovery | OpenGeoMetadata
  short_name: UWM · AGSL GeoDiscovery
  description:
    en: >-
      Explore maps, index maps, and GIS data shared by the American Geographical Society
      Library at the University of Wisconsin-Milwaukee. Check each record for access and use
      conditions.
  locale: en
  supported_locales:
    - en
  show_theme_selector: true
  routing:
    mode: hash
  icons:
    manifest: /theme-icons/uwm/manifest.webmanifest
