    background_color: '#FBF7E9'
    theme_color: '#72550B'
  banner:
    enabled: true
    tone: notice
    text:
      en: >-
        OpenGeoMetadata community prototype. Consult the source institution or publisher for
        official services.
institution:
  name: UWM · AGSL GeoDiscovery
  logo_url: /opengeometadata-bauhaus-logo.svg
  logo_alt:
    en: OpenGeoMetadata geometric logo
  logo_lockup:
    separator: none
    right_text:
      en: UWM · AGSL GeoDiscovery
    subtext:
      en: OpenGeoMetadata / Collection explorer
  header:
    logo_height_rem: 3.5
    lockup_text_size_rem: 1.2
  hero_text:
    en: Geography across places and scales.
  hero_description:
    en: >-
      Explore maps, index maps, and GIS data shared by the American Geographical Society
      Library at the University of Wisconsin-Milwaukee. Check each record for access and use
      conditions.
branding:
  colors:
    primary: '#72550B'
    active: '#72550B'
    surface: '#FFFFFF'
    surface_alt: '#FBF7E9'
    text: '#202A30'
    muted: '#505D64'
    border: '#D3DCE0'
    page_background: '#FBF7E9'
    header_background: '#72550B'
    header_text: '#FFFFFF'
    hero_panel_accent: '#72550B'
    button_primary_hover: '#72550B'
    button_secondary_text: '#72550B'
    button_secondary_border: '#D3DCE0'
    button_secondary_background: '#FFFFFF'
    button_secondary_hover: '#FBF7E9'
    lockup_background: '#72550B'
    lockup_foreground: '#FFFFFF'
api:
  base_url: https://ogm.geo4lib.app/api/v1/
  client_name: ogm-uwm
  default_query_params:
    - include_filters[ogm_repo][]=edu.uwm
navigation:
  cta:
    label:
      en: Source metadata
    href: https://github.com/OpenGeoMetadata/edu.uwm
    external: true
  cta_style: utility
  links:
    - label:
        en: Search
      href: /search?q=
      external: false
    - label:
        en: Bookmarks
      href: /bookmarks
      external: false
homepage:
  collection_intro:
    eyebrow:
      en: UWM · AGSL GeoDiscovery / Collection explorer
    facts:
      - value:
          en: Maps + GIS
        label:
          en: Discover
      - value:
          en: Map indexes
        label:
          en: Explore
      - value:
          en: AGSL
        label:
          en: Collection context
    pathways:
      - label:
          en: 01 / Places
        title:
          en: Explore geographic coverage
        description:
          en: Use the interactive map and place filters to locate resources.
        href: /search?q=&view=gallery
      - label:
          en: 02 / Maps
        title:
          en: Browse the map collection
        description:
          en: Explore map records, then inspect their descriptions and available previews.
        href: /search?q=&include_filters[gbl_resourceClass_sm][]=Maps&view=gallery
      - label:
          en: 03 / Data
        title:
          en: Find geospatial datasets
        description:
          en: Browse datasets and follow their source links for access and use information.
        href: /search?q=&include_filters[gbl_resourceClass_sm][]=Datasets&view=gallery
    map_heading:
      en: Explore geographic coverage
    map_description:
      en: Search a place or select an area on the map to discover records in this collection.
  hero_actions:
    - label:
        en: Search this collection
      href: /search?q=&view=gallery
      external: false
  hero_map:
