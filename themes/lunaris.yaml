    theme_color: '#174F63'
  banner:
    enabled: true
    tone: notice
    text:
      en: >-
        OpenGeoMetadata community prototype. Consult the source institution or publisher for
        official services.
institution:
  name: Lunaris
  logo_url: /opengeometadata-bauhaus-logo.svg
  logo_alt:
    en: OpenGeoMetadata geometric logo
  logo_lockup:
    separator: none
    right_text:
      en: Lunaris
    subtext:
      en: OpenGeoMetadata / Collection explorer
  header:
    logo_height_rem: 3.5
    lockup_text_size_rem: 1.2
  hero_text:
    en: Canadian research, connected.
  hero_description:
    en: >-
      Explore Canadian research data described by Lunaris. Search across contributing
      repositories, follow geographic coverage, and visit the original source for access and
      context.
branding:
  colors:
    primary: '#174F63'
    active: '#174F63'
    surface: '#FFFFFF'
    surface_alt: '#EEF5F6'
    text: '#202A30'
    muted: '#505D64'
    border: '#D3DCE0'
    page_background: '#EEF5F6'
    header_background: '#174F63'
    header_text: '#FFFFFF'
    hero_panel_accent: '#174F63'
