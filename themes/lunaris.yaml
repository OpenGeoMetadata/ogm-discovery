    button_secondary_hover: '#EEF5F6'
    lockup_background: '#174F63'
    lockup_foreground: '#FFFFFF'
api:
  base_url: https://ogm.geo4lib.app/api/v1/
  client_name: ogm-lunaris
  default_query_params:
    - include_filters[ogm_repo][]=ca.lunaris
navigation:
  cta:
    label:
      en: Source metadata
    href: https://github.com/OpenGeoMetadata/ca.lunaris
    external: true
  cta_style: utility
  links:
    - label:
        en: Search
      href: /search?q=
      external: false
    - label:
        en: Bookmarks
      href: /bookmarks
      external: false
homepage:
  collection_intro:
    eyebrow:
      en: Lunaris / Collection explorer
    facts:
      - value:
          en: Canada
        label:
          en: Discover
      - value:
          en: Research data
        label:
          en: Explore
      - value:
          en: Lunaris
        label:
          en: Collection context
    pathways:
      - label:
          en: 01 / Places
        title:
          en: Explore Canadian research
        description:
          en: Find records by geographic coverage and place.
        href: /search?q=&view=gallery
      - label:
          en: 02 / Subjects
        title:
          en: Follow a research topic
        description:
          en: Search the catalog and use subject filters to refine your results.
        href: /search?q=
      - label:
          en: 03 / Sources
        title:
          en: Find contributing repositories
        description:
          en: Browse records and check their publisher and source links.
        href: /search?q=&view=list
