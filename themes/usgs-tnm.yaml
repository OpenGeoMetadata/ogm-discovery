homepage:
  collection_intro:
    eyebrow:
      en: USGS / The National Map
    image:
      src: /collection-assets/usgs-shaded-relief.jpg
      alt:
        en: >-
          USGS elevation preview of tile n42w092 showing terrain and drainage patterns in eastern
          Iowa
      caption:
        en: Colorado Plateau · USGS The National Map / 3DEP / EROS GMTED2010
      href: /resources/usgs-tnm-index-dem13
    facts:
      - value:
          en: 17 datasets
        label:
          en: Source repository
      - value:
          en: Vector + raster
        label:
          en: GIS-ready resources
      - value:
          en: Public domain
        label:
          en: USGS-produced data
    pathways:
      - label:
          en: 01 / Terrain
        title:
          en: Elevation & tile indexes
        description:
          en: Locate 3DEP tiles on an index map and access Cloud Optimized GeoTIFFs.
        href: /resources/usgs-tnm-index-dem13
      - label:
          en: 02 / Water
        title:
          en: Rivers & watersheds
        description:
          en: Follow the National Hydrography Dataset into downloadable packages.
        href: /search?include_filters[pcdm_memberOf_sm][]=usgs-tnm-nhd
      - label:
          en: 03 / Infrastructure
        title:
          en: Boundaries & places
        description:
          en: Find state and national packages from the National Boundary Dataset.
        href: /search?include_filters[pcdm_memberOf_sm][]=usgs-tnm-nbd
    map_heading:
      en: Find data for your area
    map_description:
      en: Use the map to search a place, then compare formats and download a package.
  hero_actions:
    - label:
        en: Find datasets
      href: /search?q=
      external: false
    - label:
        en: Browse elevation
      href: /search?include_filters[pcdm_memberOf_sm][]=usgs-tnm-dem13
