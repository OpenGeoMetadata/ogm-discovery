api:
  base_url: https://ogm.geo4lib.app/api/v1/
  client_name: ogm-usgs-htmc
  default_query_params:
    - include_filters[pcdm_memberOf_sm][]=usgs-htmc
navigation:
  utility_links:
    - label:
        en: USGS map archive
      href: >-
        https://www.usgs.gov/programs/national-geospatial-program/historical-topographic-maps-preserving-past
      external: true
  cta:
    label:
      en: Source metadata
    href: https://github.com/OpenGeoMetadata/gov.usgs.htmc
    external: true
  cta_style: utility
  links:
    - label:
        en: Search
      href: /search?q=
      external: false
    - label:
        en: Bookmarks
      href: /bookmarks
      external: false
homepage:
  collection_intro:
    eyebrow:
      en: USGS / Historical Topographic Map Collection
    image:
      src: /collection-assets/bright-angel-1906.jpg
      alt:
        en: >-
          Scanned Bright Angel, Arizona topographic sheet with brown contours and blue Colorado
          River, edition 1906, printed 1918
      caption:
        en: Bright Angel, Arizona · 1906 edition / 1918 printing · 1:48,000 · USGS
      href: /resources/usgs-htmc-314262
    facts:
      - value:
          en: 1884–2006
        label:
          en: Collection era
      - value:
          en: GeoTIFF + GeoPDF
        label:
          en: Map downloads
      - value:
          en: State + scale
        label:
          en: Sheet indexes
    pathways:
      - label:
          en: 01 / Place
        title:
          en: Discover your landscape
        description:
          en: Browse the map gallery and narrow by place to find familiar terrain in another era.
        href: /search?q=&view=gallery
      - label:
          en: 02 / Sheets
        title:
          en: Navigate the map index
        description:
          en: Explore Arizona’s 1:48,000 sheets. Overlapping outlines reveal editions and printings.
        href: /resources/usgs-htmc-index-az-48000
      - label:
          en: 03 / Time
        title:
          en: Start with the earliest maps
        description:
          en: Browse topographic sheets in date order, from early surveys to later editions.
        href: >-
          /search?include_filters[gbl_resourceType_sm][]=Topographic%20maps&sort=year_asc&view=gallery
    map_heading:
      en: Put history in its place
    map_description:
      en: Search a location or explore map coverage, then open a sheet to inspect the scan.
  hero_actions:
    - label:
        en: Explore historical maps
      href: /search?q=&view=gallery
      external: false
    - label:
        en: Open topoView
      href: https://ngmdb.usgs.gov/topoview/
      external: true
  hero_map:
    center:
      - 39
      - -98
    zoom: 5
    initial_pan_px:
      - 0
      - 0
  featured_items:
    - id: usgs-htmc-314262
      camera:
        mode: fitBounds
        maxZoom: 8
        padding:
          - 48
          - 48
        duration: 1
    - id: usgs-htmc-index-az-48000
      camera:
        mode: fitBounds
        maxZoom: 8
        padding:
          - 48
          - 48
        duration: 1
  collection_spotlights: []
  partner_institutions: []
  blog:
    enabled: false
