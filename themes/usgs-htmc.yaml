id: usgs-htmc
label: USGS · Historical Topographic Maps
site:
  title:
    en: Historical Topographic Maps | OpenGeoMetadata
  short_name: Historical Topographic Maps
  description:
    en: >-
      Read the contours of the past. Discover historical USGS quadrangles by place and edition,
      explore sheet indexes, and download georeferenced scans for closer study.
  locale: en
  supported_locales:
    - en
  show_theme_selector: true
  routing:
    mode: hash
  banner:
    enabled: true
    tone: notice
    text:
      en: OpenGeoMetadata community prototype · Not an official NASA or USGS website.
