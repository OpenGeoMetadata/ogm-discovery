  style: network
  title:
    en: Historical Topographic Maps
  copyright:
    en: >-
      USGS maps are in the U.S. public domain. Edition, survey and printing years can differ;
      consult each sheet’s metadata when comparing maps.
  link_groups:
    - title:
        en: Explore the source
      links:
        - label:
            en: USGS historical maps
          href: >-
            https://www.usgs.gov/programs/national-geospatial-program/historical-topographic-maps-preserving-past
          external: true
        - label:
            en: topoView
          href: https://ngmdb.usgs.gov/topoview/
          external: true
    - title:
        en: Open metadata
      links:
        - label:
            en: Collection repository
          href: https://github.com/OpenGeoMetadata/gov.usgs.htmc
          external: true
        - label:
