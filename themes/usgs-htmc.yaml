  logo_url: /collection-assets/usgs-htmc.svg
  logo_alt:
    en: Historical Topographic Maps collection symbol
  logo_lockup:
    separator: none
    right_text:
      en: Historical Topographic Maps
    subtext:
      en: OpenGeoMetadata / Collection explorer
  header:
    logo_height_rem: 3.5
    lockup_text_size_rem: 1.35
  hero_text:
    en: Every landscape has a history.
  hero_description:
    en: >-
      Read the contours of the past. Discover historical USGS quadrangles by place and edition,
      explore sheet indexes, and download georeferenced scans for closer study.
