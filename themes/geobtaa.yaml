      - 42
      - -89
    zoom: 5
    initial_pan_px:
      - 0
      - 0
  featured_items:
    - id: 02284_1892-0001_9019s251h
      camera:
        mode: fitBounds
        maxZoom: 8
        padding:
          - 48
          - 48
        duration: 1
    - id: 02284_1892-0002_bk1289977
      camera:
        mode: fitBounds
        maxZoom: 8
        padding:
          - 48
          - 48
        duration: 1
  collection_spotlights: []
  partner_institutions: []
  blog:
    enabled: false
footer:
  style: network
  title:
    en: BTAA · OGM repository
  copyright:
