    theme_color: '#003C5B'
  banner:
    enabled: true
    tone: notice
    text:
      en: >-
        OpenGeoMetadata community prototype. Consult the source institution or publisher for
        official services.
institution:
  name: BTAA · OGM repository
  logo_url: /opengeometadata-bauhaus-logo.svg
  logo_alt:
    en: OpenGeoMetadata geometric logo
  logo_lockup:
    separator: none
    right_text:
      en: BTAA · OGM repository
    subtext:
      en: OpenGeoMetadata / Collection explorer
  header:
    logo_height_rem: 3.5
    lockup_text_size_rem: 1.2
  hero_text:
    en: Many libraries. Shared geographic discovery.
  hero_description:
    en: >-
      Explore the maps and geospatial data published in the Big Ten Academic Alliance’s
      OpenGeoMetadata repository. Search across contributing collections and follow each record
      to its source.
branding:
  colors:
    primary: '#003C5B'
    active: '#003C5B'
    surface: '#FFFFFF'
    surface_alt: '#EFF4F7'
    text: '#202A30'
    muted: '#505D64'
    border: '#D3DCE0'
    page_background: '#EFF4F7'
    header_background: '#003C5B'
    header_text: '#FFFFFF'
