    en: BTAA · OGM repository | OpenGeoMetadata
  short_name: BTAA · OGM repository
  description:
    en: >-
      Explore the maps and geospatial data published in the Big Ten Academic Alliance’s
      OpenGeoMetadata repository. Search across contributing collections and follow each record
      to its source.
  locale: en
  supported_locales:
    - en
  show_theme_selector: true
  routing:
    mode: hash
  icons:
    manifest: /theme-icons/geobtaa/manifest.webmanifest
